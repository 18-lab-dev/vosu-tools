[workspace]
members = ["crates/*", "tools/downloader", "tools/lazer-library", "tools/map-analysis", "tools/practice", "tools/replay-renderer", "tools/server-pp", "tools/skin-studio"]
resolver = "3"
# Unmodified upstream Prism workspace (MIT); see vendor/prism/VENDOR.md.
exclude = ["vendor/prism"]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Prism's TimSort port relies on release-mode wrapping (`stack_size - 3` with two
# runs); upstream only ships release builds, so keep that arithmetic in dev too.
[profile.dev.package.jsmath]
overflow-checks = false
