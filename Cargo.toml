[workspace]
members = ["crates/*", "tools/downloader", "tools/practice", "tools/ratings", "tools/replay-renderer", "tools/server-pp", "tools/skin-editor"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
