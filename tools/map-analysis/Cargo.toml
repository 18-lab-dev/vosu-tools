[package]
name = "vosu-map-analysis"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vosu-map-analysis"
path = "src/main.rs"

[package.metadata.vosu-tools]
replaces = ["mania-ratings"]

[dependencies]
mania-keys = { path = "../../crates/mania-keys" }
minacalc = { path = "../../crates/minacalc" }
prism = { path = "../../vendor/prism/crates/prism" }
chart-parser = { path = "../../vendor/prism/crates/chart-parser" }
vosu-tool-sdk = { path = "../../crates/vosu-tool-sdk" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
axum = { version = "=0.8.9", features = ["query"] }
md-5 = "0.11.0"
rosu-map = "=0.2.1"
rosu-pp = "=4.0.1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs"] }

[dev-dependencies]
tempfile = "3.26.0"
