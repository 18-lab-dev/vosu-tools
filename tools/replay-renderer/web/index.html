<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Replay renderer</title>
    <link rel="stylesheet" href="/tools/_host/v1/theme.css" vite-ignore />
  </head>
  <body class="v-app">
    <header class="v-bar">
      <span class="v-bar__title">Replay renderer</span>
      <span class="v-dot" id="link-dot"></span>
      <span class="v-muted" id="link">Offline</span>
      <span class="v-muted now" id="now" hidden></span>
      <span class="v-bar__spacer"></span>
      <span class="v-dot" id="tally" data-state="busy" hidden></span>
      <span class="v-muted" id="rendering" hidden>Rendering</span>
      <button
        id="mute"
        type="button"
        class="v-btn v-btn--ghost v-btn--icon"
        aria-label="Mute preview audio"
        aria-pressed="true"
      ></button>
    </header>
    <main class="v-main studio">
      <section class="v-panel replays" id="drop" aria-label="Replays">
        <div class="v-panel__head">
          <span class="v-label">Replays</span>
          <div class="v-tabs" role="tablist" aria-label="Replay list">
            <button id="tab-map" role="tab" type="button" aria-selected="true">This map</button>
            <button id="tab-all" role="tab" type="button" aria-selected="false" tabindex="-1">All</button>
          </div>
          <button id="refresh" type="button" class="v-btn v-btn--sm v-btn--ghost">Rescan</button>
        </div>
        <div class="replays-body">
          <div class="v-row">
            <input id="filter" class="v-input" type="search" placeholder="Filter" aria-label="Filter replays" />
            <label class="v-btn v-file"><input id="files" type="file" accept=".osr" multiple />Open .osr</label>
          </div>
          <div id="replay-region" class="v-scroll">
            <table class="v-table">
              <thead>
                <tr><th>Player</th><th class="v-num">Score</th><th><span class="sr-only">Add</span></th></tr>
              </thead>
              <tbody id="replays"></tbody>
            </table>
          </div>
        </div>
      </section>
      <section class="v-panel timeline" aria-label="Timeline">
        <div class="v-panel__head">
          <span class="v-label">Timeline</span>
          <span class="v-badge" id="track-count">0</span>
          <span class="v-bar__spacer"></span>
          <button id="timeline-expand" type="button" class="v-btn v-btn--sm v-btn--ghost v-btn--icon" aria-label="Expand timeline" aria-haspopup="dialog">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
          </button>
        </div>
        <ol id="tracks" class="v-panel__body v-scroll tracks"></ol>
      </section>
      <section class="v-panel program" aria-label="Preview">
        <div id="missing" class="missing" role="alert" hidden></div>
        <div class="stage">
          <div id="gate" class="gate"><div id="preview" class="gate-canvas"><p class="v-empty">No tracks</p></div></div>
        </div>
        <div class="v-toolbar transport">
          <button id="play" type="button" class="v-btn v-btn--icon" aria-label="Play">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
          </button>
          <output id="time" class="v-mono" aria-label="Position">00:00:00:00</output>
          <input id="seek" class="v-range" aria-label="Position" type="range" min="0" max="1000" value="0" />
          <output id="duration" class="v-mono v-muted" aria-label="Duration">00:00:00:00</output>
        </div>
      </section>
      <section class="v-panel output" aria-label="Output">
        <div class="v-panel__head"><span class="v-label">Output</span></div>
        <div class="v-panel__body v-scroll">
          <div class="v-field">
            <span id="size-label">Resolution</span>
            <div id="size-picker"></div>
          </div>
          <div class="pair">
            <label class="v-field"><span>Frame rate</span><input id="fps" class="v-input" type="number" min="1" max="240" value="60" /></label>
            <label class="v-field"><span>Layout</span>
              <select id="layout" class="v-select">
                <option value="auto">Auto</option>
                <option value="side-by-side">Side by side</option>
                <option value="stacked">Stacked</option>
                <option value="grid">Grid</option>
              </select>
            </label>
          </div>
          <div class="pair">
            <label class="v-field"><span>Outro (ms)</span><input id="outro" class="v-input" type="number" min="0" max="60000" step="50" value="1250" /></label>
            <label class="v-field"><span>Fade (ms)</span><input id="fade" class="v-input" type="number" min="0" max="60000" step="50" value="250" /></label>
          </div>
          <label class="v-field"><span>File name</span><input id="out" class="v-input" placeholder="replay.mp4" spellcheck="false" /></label>
          <span id="folder" class="v-mono v-muted folder"></span>
          <div class="v-row">
            <button id="queue" type="button" class="v-btn v-btn--primary">Render MP4</button>
            <button id="webm" type="button" class="v-btn">Export WebM</button>
          </div>
          <ol id="jobs" class="jobs"></ol>
          <div class="subhead">
            <span class="v-label">Layout</span>
            <span class="v-bar__spacer"></span>
            <button id="layout-reset" type="button" class="v-btn v-btn--sm v-btn--ghost">Reset</button>
          </div>
          <p id="layout-empty" class="v-muted">Select a playfield or overlay in the preview.</p>
          <div id="inspector" class="inspector" hidden>
            <span id="inspector-title" class="inspector-title"></span>
            <div class="inspector-grid">
              <label class="v-field"><span>X</span><input id="lay-x" class="v-input" type="number" step="1" /></label>
              <label class="v-field"><span>Y</span><input id="lay-y" class="v-input" type="number" step="1" /></label>
              <label class="v-field"><span>W</span><input id="lay-w" class="v-input" type="number" step="1" min="1" /></label>
              <label class="v-field"><span>H</span><input id="lay-h" class="v-input" type="number" step="1" min="1" /></label>
              <label class="v-field"><span>Scale</span><input id="lay-scale" class="v-input" type="number" step="0.05" min="0.05" /></label>
              <label class="v-field"><span>Opacity</span><input id="lay-opacity" class="v-input" type="number" step="0.05" min="0" max="1" /></label>
            </div>
          </div>
          <div class="subhead"><span class="v-label">Skins</span></div>
          <p id="current-skin" class="skin-current"></p>
          <label class="v-btn v-file"><input id="osk" type="file" accept=".osk,.zip" />Import .osk</label>
          <span id="import-status" class="v-muted" role="status"></span>
          <ul id="imported" class="imported"></ul>
          <div id="overlay-layout" class="overlays"></div>
        </div>
      </section>
    </main>
    <dialog id="timeline-modal" class="v-drawer timeline-modal" aria-labelledby="timeline-modal-title">
      <div class="v-drawer__head">
        <h2 id="timeline-modal-title">Timeline</h2>
        <button id="timeline-close" type="button" class="v-btn v-btn--sm v-btn--ghost">Close</button>
      </div>
      <div id="timeline-modal-body" class="v-drawer__body"></div>
    </dialog>
    <div id="toast" class="v-toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
