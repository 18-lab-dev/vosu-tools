<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tools/_host/v1/theme.css" vite-ignore>
</head>
<body class="v-app">
<header class="v-bar">
  <span class="v-bar__title">Practice</span>
  <span id="live-dot" class="v-dot"></span><span id="live" class="v-muted" role="status">Connecting</span>
  <span class="v-bar__spacer"></span>
  <div class="v-toolbar" role="group" aria-label="Profiles">
    <select id="profile" class="v-select profile-select" aria-label="Profile"></select>
    <span id="dirty" class="v-badge v-badge--accent" hidden>modified</span>
    <button type="button" id="profile-save" class="v-btn v-btn--ghost">Save</button>
    <button type="button" id="profile-save-as" class="v-btn v-btn--ghost">Save as…</button>
    <button type="button" id="profile-delete" class="v-btn v-btn--ghost">Delete</button>
    <form id="profile-new" class="v-toolbar" hidden>
      <input id="profile-name" class="v-input profile-name" maxlength="40" required placeholder="Profile name" aria-label="New profile name" autocomplete="off">
      <button type="submit" class="v-btn">Save</button>
      <button type="button" id="profile-new-cancel" class="v-btn v-btn--ghost">Cancel</button>
    </form>
  </div>
  <span class="v-toolbar__sep"></span>
  <span id="access" class="v-badge">Connecting</span>
  <span id="access-help" class="v-help" tabindex="0" role="img" data-tip-pos="left" aria-label="Open Practice from the dashboard to generate maps or save profiles." data-tip="Open Practice from the dashboard to generate maps or save profiles." hidden></span>
</header>

<main id="main" class="v-main practice">
  <form id="form" class="v-panel controls" novalidate>
    <div class="v-panel__body v-scroll controls-body">
      <section class="v-stack section">
        <div class="section-head"><span class="v-label"><b>01</b> / Rate</span><span id="rate-readout" class="v-mono rate-readout">1.00×</span></div>
        <input id="rate-slider" class="v-range" type="range" min="0.5" max="2" step="0.01" value="1" aria-label="Rate">
        <div class="pair">
          <label class="v-field"><span>Rate</span><input name="rate" class="v-input" type="number" min="0.5" max="2" step="0.01" value="1"></label>
          <label class="v-check"><input name="pitch" type="checkbox"> Change pitch</label>
        </div>
      </section>

      <section class="v-stack section">
        <div class="section-head"><span class="v-label"><b>02</b> / Transforms</span></div>
        <div id="transforms" class="v-toolbar"></div>
        <div id="transform-options" class="pair"></div>
      </section>

      <section class="v-stack section">
        <div class="section-head"><span class="v-label"><b>03</b> / Difficulty</span></div>
        <div id="difficulty" class="pair"></div>
      </section>

      <section class="v-stack section">
        <div class="section-head">
          <span class="v-label"><b>04</b> / Trim</span>
          <button type="button" id="clear-trims" class="v-btn v-btn--ghost v-btn--sm" hidden>Clear</button>
        </div>
        <ol id="trim-list" class="trim-list"></ol>
        <p id="trim-empty" class="v-empty">Drag on the timeline to keep sections.</p>
        <div class="pair">
          <label class="v-field"><span>Lead-in (ms)</span><input name="lead_in_ms" class="v-input" type="number" min="0" max="30000" step="100"></label>
          <label class="v-field"><span>Lead-out (ms)</span><input name="lead_out_ms" class="v-input" type="number" min="0" max="30000" step="100"></label>
          <label class="v-field"><span>Gap (ms)</span><input name="gap_ms" class="v-input" type="number" min="0" max="30000" step="100"></label>
          <label class="v-field"><span>Fade (ms)</span><input name="fade_ms" class="v-input" type="number" min="0" max="10000" step="10"></label>
        </div>
      </section>
    </div>
    <div class="controls-foot">
      <div class="v-row">
        <button class="v-btn v-btn--primary generate" id="generate" type="submit">Generate map</button>
        <button id="cancel" type="button" class="v-btn" hidden>Cancel</button>
      </div>
      <div id="progress" class="v-meter" style="--v-value: 0" hidden></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </form>

  <section class="v-panel map" aria-labelledby="title">
    <img id="banner-art" class="map-art" alt="" hidden>
    <div class="map-text">
      <span id="ruleset" class="v-badge v-badge--accent" hidden></span>
      <h1 id="title" class="v-title map-title">No beatmap selected</h1>
      <span id="subtitle" class="v-muted map-subtitle"></span>
    </div>
    <dl id="stats" class="stats" aria-label="Source and result statistics"></dl>
  </section>

  <section class="v-panel preview" aria-label="Preview">
    <div class="v-panel__head">
      <span class="v-label">Preview</span>
      <span id="version" class="v-muted v-mono version"></span>
      <span id="skin" class="v-badge skin" title="Skin">Classic</span>
      <output id="clock" class="v-mono clock">0:00.0 / 0:00.0</output>
      <button type="button" id="play" class="v-btn v-btn--sm" disabled>Play</button>
      <button type="button" id="mute" class="v-btn v-btn--sm v-btn--icon" aria-pressed="true" aria-label="Mute preview audio" title="Mute preview audio">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5.5h3l4-3.5v12l-4-3.5h-3z" fill="currentColor" stroke="none"/><path class="icon-muted" d="M10.5 5.5l4.5 5m0-5l-4.5 5"/><path class="icon-sound" d="M10.5 5a4 4 0 0 1 0 6M12.5 3a7 7 0 0 1 0 10"/></svg>
      </button>
    </div>
    <div class="stage">
      <canvas id="canvas" aria-label="Playfield preview of the generated map"></canvas>
      <p id="preview-message" class="v-empty stage-message" hidden></p>
    </div>
    <ul id="warnings" class="warnings"></ul>
  </section>

  <section class="v-panel timeline" aria-label="Timeline">
    <div class="v-panel__head">
      <span class="v-label">Timeline</span>
      <span id="timeline-label" class="v-muted timeline-label"></span>
      <span id="timeline-note" class="timeline-note"></span>
    </div>
    <div class="timeline-body">
      <div id="strip" class="strip">
        <svg class="graph" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="ranges"></div>
        <div class="playhead" hidden></div>
      </div>
      <div id="axis" class="axis v-mono" aria-hidden="true"></div>
    </div>
  </section>
</main>
<script type="module" src="/src/app.ts"></script>
</body>
</html>
