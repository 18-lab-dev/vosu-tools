manifest_version = 1
id = "practice"
name = "osu! practice tool"
version = "0.1.0"
description = "Generate unranked practice copies with offline rate, difficulty and map transforms."
author = "18-LAB"
icon = "assets/icon.svg"
banner = "assets/banner.svg"
[ui]
root = "web/dist"
[service]
command = ["bin/vosu-practice"]
startup = "on-demand"
[api]
read = ["/v1/current", "/v1/generated", "/v1/jobs", "/v1/settings"]
write = ["/v1/generate", "/v1/preview", "/v1/settings", "/v1/jobs", "/v1/delete"]
[[requires]]
id = "ratings"
version = ">=0.1.0"
[permissions]
host = ["context", "songs:write"]
[cli]
command = ["bin/vosu-practice", "cli"]
summary = "Create, list and safely delete practice copies"
