manifest_version = 1
id = "practice"
name = "osu! practice tool"
version = "0.1.2"
description = "Practice maps: change rate, difficulty and ruleset transforms, trim to the sections you want to grind, and preview the result before generating it."
author = "18-LAB"
icon = "art/icon.svg"
banner = "art/banner.svg"
[ui]
root = "web/dist"
[service]
role = "backend"
command = ["bin/vosu-practice"]
startup = "on-demand"
[api]
read = ["/v1/current", "/v1/timeline", "/v1/preview", "/v1/profiles", "/v1/generated", "/v1/jobs"]
write = ["/v1/generate", "/v1/profiles", "/v1/jobs", "/v1/delete"]
[permissions]
host = ["context", "songs:write"]
[cli]
command = ["bin/vosu-practice", "cli"]
summary = "Create, list and safely delete practice copies"
