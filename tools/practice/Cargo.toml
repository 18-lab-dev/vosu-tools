[package]
name = "vosu-tool-practice"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vosu-practice"
path = "src/main.rs"

[dependencies]
osu-file = { path = "../../crates/osu-file" }
mania-keys = { path = "../../crates/mania-keys" }
vosu-tool-sdk = { path = "../../crates/vosu-tool-sdk" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
axum = { version = "=0.8.9", features = ["json", "query"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
md-5 = "=0.11.0"
anyhow = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.26.0"
hound = "3.5.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
