manifest_version = 1
id = "downloader"
name = "Beatmap downloader"
version = "0.1.0"
description = "Discover maps from your selected beatmap and play history; queue polite, validated mirror downloads."
author = "18-LAB"

[ui]
root = "web/dist"

[service]
command = ["bin/vosu-downloader"]
startup = "on-demand"

[api]
read = ["/v1/state", "/v1/jobs"]
write = ["/v1/settings", "/v1/search", "/v1/library", "/v1/queue", "/v1/jobs", "/v1/import"]

[permissions]
host = ["context", "songs:write"]
