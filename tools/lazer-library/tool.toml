manifest_version = 1
id = "lazer-library"
name = "Lazer library"
version = "0.1.0"
description = "Read-only access to lazer beatmaps, skins and replay files from consistent Realm snapshots."
author = "18-LAB"
icon = "assets/icon.svg"
banner = "assets/banner.svg"

[service]
command = ["bin/vosu-lazer-library"]
startup = "on-demand"

[cli]
command = ["bin/vosu-lazer-library", "cli"]
summary = "Query lazer maps, owned sets, skins and scores"

[api]
read = ["/v1/status", "/v1/beatmaps", "/v1/beatmapsets", "/v1/skins", "/v1/scores"]
write = []

[permissions]
host = ["context"]
