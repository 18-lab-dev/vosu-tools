manifest_version = 1
id = "ratings"
name = "Ratings"
version = "0.1.0"
description = "Native mania analysis: MinaCalc, Quaver, Interlude, osu!mania stars, timelines and experimental Reform estimates."
author = "18-LAB"
icon = "assets/icon.svg"
banner = "assets/banner.svg"

[service]
command = ["bin/vosu-ratings"]
startup = "on-demand"

[api]
read = ["/v1/beatmap"]
write = ["/v1/calculate"]

[permissions]
host = ["context"]

[cli]
command = ["bin/vosu-ratings", "cli"]
summary = "Compare mania ratings, rate curves, timelines and selected sections"

[ui]
root = "web/dist"
