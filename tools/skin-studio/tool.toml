manifest_version = 1
id = "skin-studio"
name = "Skin studio"
version = "0.1.0"
description = "Browse stable and lazer skins, preview elements and gameplay in every ruleset, mix element groups or single assets into a new stable skin or a downloadable .osk, and edit skin.ini"
author = "18-LAB"
icon = "art/icon.svg"
banner = "art/banner.svg"

[ui]
root = "web/dist"

[service]
role = "backend"
command = ["bin/vosu-skin-studio"]
startup = "on-demand"


[api]
read = ["/v1/library", "/v1/skin", "/v1/asset", "/v1/animation", "/v1/exports"]
write = ["/v1/save", "/v1/folders", "/v1/build", "/v1/exports"]

[permissions]
host = ["context"]
