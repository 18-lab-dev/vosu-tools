manifest_version = 1
id = "skin-studio"
name = "Skin studio"
version = "0.4.2"
description = "Browse stable and lazer skins, preview elements and gameplay in every ruleset, mix element groups or single assets into a new stable skin or a downloadable .osk, and edit skin.ini"
author = "18-LAB"
icon = "art/icon.svg"
banner = "art/banner.svg"

[ui]
root = "web/dist"

[service]
role = "backend"
command = ["bin/vosu-skin-studio"]
startup = "on-demand"


[api]
read = ["/v1/library", "/v1/skin", "/v1/asset", "/v1/animation", "/v1/exports", "/v1/plays", "/v1/rows", "/v1/applied"]
write = ["/v1/save", "/v1/folders", "/v1/build", "/v1/exports", "/v1/uploads", "/v1/derive", "/v1/review", "/v1/apply", "/v1/restore"]

[permissions]
host = ["context"]
