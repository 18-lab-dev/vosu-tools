<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skin studio</title>
    <link rel="stylesheet" href="/tools/_host/v1/theme.css" vite-ignore />
  </head>
  <body class="v-app">
    <header class="v-bar">
      <span class="v-bar__title">Skin studio</span>
      <span id="live-dot" class="v-dot" hidden></span>
      <span id="live" class="v-muted" hidden></span>
      <div class="v-tabs" role="tablist" aria-label="Workspace">
        <button
          id="tab-elements"
          role="tab"
          type="button"
          aria-selected="true"
          aria-controls="elements-view"
        >
          Elements
        </button>
        <button
          id="tab-ini"
          role="tab"
          type="button"
          aria-selected="false"
          aria-controls="ini-view"
        >
          skin.ini
        </button>
        <button
          id="tab-preview"
          role="tab"
          type="button"
          aria-selected="false"
          aria-controls="preview-view"
        >
          Preview
        </button>
      </div>
      <span id="status" class="v-muted status" role="status"></span>
      <span class="v-bar__spacer"></span>
      <button
        id="mute"
        type="button"
        class="v-btn v-btn--ghost v-btn--sm"
        aria-pressed="true"
      >
        Muted
      </button>
      <span id="mode" class="v-badge"></span>
    </header>

    <main class="v-main studio">
      <section class="v-panel library" aria-label="Skin library">
        <div class="v-panel__head">
          <span class="v-label">Library</span>
          <button
            id="add-toggle"
            type="button"
            class="v-btn v-btn--sm v-btn--ghost"
            aria-expanded="false"
            aria-controls="add-folder"
          >
            Add folder
          </button>
        </div>
        <div class="library-tools">
          <form id="add-folder" class="add-folder" hidden>
            <input
              id="folder-path"
              class="v-input v-input--mono"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Skin folder path"
              aria-label="Skin folder path"
              aria-describedby="folder-error"
            />
            <button type="submit" class="v-btn">Add</button>
            <p id="folder-error" class="folder-error" role="alert" hidden></p>
          </form>
          <input
            id="filter"
            class="v-input"
            type="search"
            placeholder="Filter skins"
            aria-label="Filter skins"
            autocomplete="off"
          />
        </div>
        <div id="skins" class="v-scroll skins"></div>
      </section>

      <section class="v-panel work">
        <div class="v-panel__head focus-head">
          <span id="focus-name" class="focus-name">Skin</span>
          <span id="focus-meta" class="v-muted v-mono focus-meta"></span>
          <ol id="colour-bar" class="colour-bar" aria-label="Skin colours"></ol>
          <button
            id="focus-osk"
            type="button"
            class="v-btn v-btn--sm"
            title="Download this skin as an .osk"
            disabled
          >
            Download .osk
          </button>
          <button id="use-base" type="button" class="v-btn v-btn--sm" disabled>
            Use as mix base
          </button>
        </div>

        <section
          id="elements-view"
          class="elements-view"
          role="tabpanel"
          aria-labelledby="tab-elements"
        >
          <div class="v-toolbar">
            <div id="cats" class="v-seg" aria-label="Element categories"></div>
          </div>
          <div id="groups" class="v-scroll groups"></div>
        </section>

        <section
          id="ini-view"
          class="ini-view"
          role="tabpanel"
          aria-labelledby="tab-ini"
          hidden
        >
          <div class="v-toolbar">
            <div class="v-seg" role="group" aria-label="skin.ini source">
              <button id="ini-focus" type="button" aria-pressed="true">
                Selected skin
              </button>
              <button id="ini-mix" type="button" aria-pressed="false">
                Mix draft
              </button>
            </div>
            <span id="ini-note" class="v-badge" hidden></span>
            <span class="v-bar__spacer"></span>
            <button id="ini-reset" type="button" class="v-btn v-btn--sm" hidden>
              Recompose
            </button>
            <button id="reload" type="button" class="v-btn v-btn--sm" disabled>
              Reload
            </button>
            <button
              id="save"
              type="button"
              class="v-btn v-btn--sm v-btn--primary"
              disabled
            >
              Save
            </button>
          </div>
          <div class="ini-body">
            <div id="editor" aria-label="skin.ini source"></div>
            <section class="corrections" aria-labelledby="corrections-title">
              <div class="v-panel__head">
                <span id="corrections-title" class="v-label">Corrections</span>
                <span id="issue-count" class="v-badge"></span>
              </div>
              <ol id="diagnostics" class="v-scroll diagnostics"></ol>
            </section>
          </div>
        </section>

        <section
          id="preview-view"
          class="preview-view"
          role="tabpanel"
          aria-labelledby="tab-preview"
          hidden
        >
          <div class="v-toolbar">
            <div class="v-seg" role="group" aria-label="Preview skin">
              <button id="pv-focus" type="button" aria-pressed="true">
                Selected skin
              </button>
              <button id="pv-mix" type="button" aria-pressed="false">
                Mix draft
              </button>
            </div>
            <span class="v-toolbar__sep"></span>
            <div
              id="pv-rulesets"
              class="v-seg"
              role="group"
              aria-label="Ruleset"
            >
              <button type="button" data-demo="osu" aria-pressed="true">
                osu!
              </button>
              <button type="button" data-demo="taiko" aria-pressed="false">
                Taiko
              </button>
              <button type="button" data-demo="fruits" aria-pressed="false">
                Catch
              </button>
              <button type="button" data-demo="mania" aria-pressed="false">
                Mania
              </button>
            </div>
            <div
              id="pv-keys"
              class="v-seg"
              role="group"
              aria-label="Keys"
              hidden
            >
              <button type="button" data-keys="4" aria-pressed="true">
                4K
              </button>
              <button type="button" data-keys="7" aria-pressed="false">
                7K
              </button>
            </div>
            <span class="v-bar__spacer"></span>
            <span id="pv-state" class="v-muted pv-state" role="status"></span>
            <button
              id="pv-play"
              type="button"
              class="v-btn v-btn--sm"
              aria-pressed="true"
            >
              Pause
            </button>
          </div>
          <div id="pv-stage" class="pv-stage">
            <canvas id="pv-canvas" aria-label="Gameplay preview"></canvas>
          </div>
        </section>

        <p id="guide" class="v-empty">Select a skin.</p>
      </section>

      <section class="v-panel mix" aria-label="Mix">
        <div class="v-panel__head">
          <span class="v-label">Mix</span>
          <button
            id="mix-reset"
            type="button"
            class="v-btn v-btn--sm v-btn--ghost"
          >
            Clear
          </button>
        </div>
        <div class="mix-head">
          <label class="v-field">
            <span>Name</span>
            <input
              id="mix-name"
              class="v-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              value="My mix"
            />
          </label>
          <div class="v-field">
            <span>Base</span>
            <div class="mix-base">
              <span id="mix-base" class="mix-base__name">None</span>
              <button
                id="mix-base-clear"
                type="button"
                class="v-btn v-btn--sm v-btn--ghost"
                hidden
              >
                Clear
              </button>
            </div>
          </div>
        </div>
        <ol id="mix-picks" class="v-scroll mix-picks"></ol>
        <div class="mix-foot">
          <p id="mix-summary" class="v-muted v-mono mix-summary"></p>
          <button
            id="build-stable"
            type="button"
            class="v-btn v-btn--primary"
            disabled
          >
            Create stable skin
          </button>
          <button id="build-osk" type="button" class="v-btn" disabled>
            Download .osk
          </button>
          <div class="v-row">
            <button
              id="mix-ini"
              type="button"
              class="v-btn v-btn--sm v-btn--ghost"
            >
              Review skin.ini
            </button>
            <button
              id="mix-plan"
              type="button"
              class="v-btn v-btn--sm v-btn--ghost"
            >
              Download plan
            </button>
          </div>
          <div id="mix-result" class="mix-result" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <audio id="player" preload="none" muted></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
