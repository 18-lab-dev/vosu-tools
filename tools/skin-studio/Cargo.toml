[package]
name = "vosu-skin-studio"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vosu-tool-sdk = { path = "../../crates/vosu-tool-sdk" }
axum = "0.8"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
png = "0.18"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
md-5 = "0.10"
osu-db = { path = "../../crates/osu-db" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
