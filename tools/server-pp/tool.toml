manifest_version = 1
id = "server-pp"
name = "Server pp calculator"
version = "0.1.0"
author = "18-LAB"
description = "Reproduce pinned public Akatsuki and Mamestagram calculator snapshots, and run your own pp formulas as sandboxed WebAssembly calculators. Live deployment parity is not claimed."
icon = "art/icon.svg"
banner = "art/banner.svg"

[service]
command = ["bin/vosu-server-pp"]
startup = "on-demand"

[cli]
command = ["bin/vosu-server-pp", "cli"]
summary = "Calculate private-server snapshot pp and compare official pp"

[api]
read = ["/v1/servers", "/v1/current", "/v1/pp"]
write = ["/v1/calculate"]

[permissions]
host = ["context"]
