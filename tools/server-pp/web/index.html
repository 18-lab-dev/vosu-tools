<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Server pp calculator</title>
    <link rel="stylesheet" href="/tools/_host/v1/theme.css" vite-ignore />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body class="v-app">
    <header class="v-bar">
      <span class="v-bar__title">Server pp calculator</span>
      <span id="live-dot" class="v-dot"></span>
      <span id="live" class="v-muted">Connecting</span>
      <span id="map" class="map v-muted">No map selected</span>
      <span class="v-bar__spacer"></span>
      <label id="open-label" class="v-btn v-btn--sm v-file"
        ><input id="file" type="file" accept=".osu" />Open .osu</label
      >
      <button id="clear-file" type="button" class="v-btn v-btn--sm v-btn--ghost" hidden>
        Selected map
      </button>
      <a
        id="settings-link"
        class="v-btn v-btn--ghost v-btn--icon"
        aria-label="Settings"
        title="Settings"
        target="_blank"
        rel="noopener noreferrer"
        >⚙</a
      >
    </header>
    <main class="v-main v-split">
      <section class="v-panel" aria-labelledby="modules-title">
        <div class="v-panel__head">
          <span id="modules-title" class="v-label">Calculators</span>
          <span id="module-count" class="v-badge"></span>
        </div>
        <ul id="modules" class="modules v-scroll"></ul>
        <dl id="config" class="config v-facts"></dl>
      </section>
      <section class="v-panel results" aria-labelledby="results-title">
        <div class="v-panel__head">
          <span id="results-title" class="v-label">Results</span>
        </div>
        <form id="score" class="v-toolbar score" autocomplete="off">
          <div class="v-seg" role="group" aria-label="Score">
            <button type="button" data-source="whatif" aria-pressed="true">What if</button>
            <button type="button" data-source="live" aria-pressed="false">Live play</button>
          </div>
          <span class="v-toolbar__sep"></span>
          <label class="v-field v-field--inline"
            ><span>Mods</span
            ><input class="v-input v-input--mono mods" name="mods" placeholder="NM" spellcheck="false" maxlength="40"
          /></label>
          <label class="v-field v-field--inline"
            ><span>Acc</span
            ><input class="v-input short" name="acc" type="number" min="0" max="100" step="0.01" value="100"
          /></label>
          <label class="v-field v-field--inline"
            ><span>Misses</span
            ><input class="v-input short" name="misses" type="number" min="0" step="1" value="0"
          /></label>
          <label class="v-field v-field--inline"
            ><span>Combo</span
            ><input class="v-input short" name="combo" type="number" min="0" step="1" placeholder="max"
          /></label>
          <label class="v-field v-field--inline"
            ><span>Ruleset</span
            ><select class="v-select" name="mode">
              <option value="">Map's own</option>
              <option value="osu">osu!</option>
              <option value="taiko">taiko</option>
              <option value="fruits">catch</option>
              <option value="mania">mania</option>
            </select></label
          >
        </form>
        <div class="v-scroll results__body">
          <table id="ledger" class="v-table" hidden>
            <thead>
              <tr>
                <th scope="col">Calculator</th>
                <th scope="col" class="v-num">pp</th>
                <th scope="col" class="v-num">If FC</th>
                <th scope="col" class="v-num">Vs official</th>
                <th scope="col" class="v-num">Stars</th>
                <th scope="col">Breakdown</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="empty" class="v-empty">No map selected.</p>
        </div>
      </section>
    </main>
  </body>
</html>
