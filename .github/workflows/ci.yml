name: Tool CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang libclang-dev cmake pkg-config
      - name: Locate native Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path "$clang/libclang.dll")) { throw 'LLVM libclang.dll is required' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test ./packages ./tools
      - run: python -m unittest discover -s scripts -p test_package.py
      - name: Validate package build plan
        run: python scripts/package.py --target ${{ matrix.target }} --base-url https://example.invalid/releases/test --dry-run
